name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and attest without publishing a release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  SSG_VERSION: 0.0.77

jobs:
  # Builds, proves and signs the release files; publishing is a later job
  # so the SLSA provenance can be attached and checksummed with them.
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC for actions/attest and keyless cosign signing
      attestations: write
    outputs:
      version: ${{ steps.subjects.outputs.version }}
      hashes: ${{ steps.subjects.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-ssg
        with:
          path: ~/.cargo/bin/ssg
          key: ssg-${{ env.SSG_VERSION }}-${{ runner.os }}

      - if: steps.cache-ssg.outputs.cache-hit != 'true'
        run: cargo install ssg --locked --version "$SSG_VERSION"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify signed tag and version
        if: github.ref_type == 'tag'
        run: |
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/allowed_signers"
          git verify-tag "$GITHUB_REF_NAME"
          ./scripts/verify_release_version.sh
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
          python3 scripts/release_notes.py --check

      - name: Pin build time to commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build and audit
        run: |
          rm -rf public
          ssg build --content _posts --template _layouts --output public
          ssg audit -f ssg.toml -o public --severity warn --fail-on warn
          python3 scripts/post-build.py
          python3 scripts/regression-test.py

      - name: Package website, SBOM, and checksums
        run: |
          mkdir -p dist
          version="$(tr -d '[:space:]' < VERSION)"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          python3 scripts/release_backfill.py --src . --tag "v${version}" --out dist --mtime "$SOURCE_DATE_EPOCH"

      - name: Prove the archive is reproducible
        run: |
          rm -rf public
          ssg build --content _posts --template _layouts --output public > /dev/null
          ssg audit -f ssg.toml -o public --severity warn --fail-on warn > /dev/null
          python3 scripts/post-build.py > /dev/null
          python3 scripts/release_backfill.py --src . --tag "v${RELEASE_VERSION}" --out "$RUNNER_TEMP/rebuild" --mtime "$SOURCE_DATE_EPOCH"
          if ! diff dist/SHA256SUMS "$RUNNER_TEMP/rebuild/SHA256SUMS"; then
            echo "::error::Release build is not reproducible. Diff in SHA256SUMS:"
            diff -u dist/SHA256SUMS "$RUNNER_TEMP/rebuild/SHA256SUMS"
            exit 1
          fi
          echo "reproducible: two clean builds gave identical release files"

      # SLSA provenance subjects: the archive and SBOM, as sha256sum
      # prints them, base64-encoded for the generic generator.
      - name: Record provenance subjects
        id: subjects
        run: |
          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "hashes=$(cd dist && sha256sum bankstatementparser-site-v* | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Attest website provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/bankstatementparser-site-v*.tar.gz"

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/bankstatementparser-site-v${{ env.RELEASE_VERSION }}.tar.gz"
          sbom-path: "dist/bankstatementparser-site-v${{ env.RELEASE_VERSION }}.cdx.json"

      # Keyless sigstore signatures (Fulcio + Rekor via the workflow's OIDC
      # identity, no secrets) for every release file, attached as .sig +
      # .pem, as bankstatementparser-mcp signs its distributions.
      - name: Install cosign
        if: github.ref_type == 'tag'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v2.4.3"

      - name: Sign release files (keyless)
        if: github.ref_type == 'tag'
        run: |
          for f in dist/*; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bankstatementparser-site-release-candidate
          path: dist/
          if-no-files-found: error

  # SLSA Build Level 3 provenance (*.intoto.jsonl) for the archive and
  # SBOM. The generator must be referenced by tag, not SHA: its builder
  # verifies its own ref (slsa-github-generator README).
  provenance:
    needs: [release]
    if: github.ref_type == 'tag'
    permissions:
      actions: read # read the workflow run
      id-token: write # sign the provenance
      contents: write # required by the generator's upload path
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      provenance-name: bankstatementparser-site-v${{ needs.release.outputs.version }}.intoto.jsonl
      upload-assets: false

  # Runs last, with every asset in hand (archive, SBOM, SHA256SUMS, their
  # signatures and certificates, and the provenance), so the Checksums
  # section of the notes covers everything the release attaches.
  publish:
    needs: [release, provenance]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bankstatementparser-site-release-candidate
          path: dist/

      - name: Download SLSA provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist/
          notes="$RUNNER_TEMP/notes.md"
          python3 scripts/release_notes.py --tag "$GITHUB_REF_NAME" --assets dist --out "$notes"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "$(python3 scripts/release_notes.py --tag "$GITHUB_REF_NAME" --title)" \
            --notes-file "$notes"
