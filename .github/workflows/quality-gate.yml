name: Quality Gate & WCAG AAA Compliance

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master, "feat/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: WCAG 2.2 AAA & Lighthouse Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install Audit Tooling
        run: |
          npm install -g pa11y-ci @lhci/cli

      - name: Verify SSG Manifest Conformance
        run: |
          if [ -f config/ssg.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('config/ssg.json', 'utf8')); console.log('config/ssg.json is valid JSON');"
          fi

      - name: Run Deterministic Branch Hygiene Check
        run: |
          if [ -f scripts/prune-branches.sh ]; then
            chmod +x scripts/prune-branches.sh
            DRY_RUN=true bash scripts/prune-branches.sh origin
          fi
