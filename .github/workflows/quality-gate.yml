name: Quality Gate & WCAG AAA Compliance

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master, "feat/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: WCAG 2.2 AAA & Lighthouse Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install locked Node tooling
        run: npm ci --ignore-scripts

      # Lighthouse 100 in every category (SEO audit by audit on the noindex
      # 404 and offline pages), FCP <= 1000 ms and LCP <= 1200 ms under
      # simulated mobile throttling, on every page of the committed docs/
      # tree the CI deploy job publishes. `make lighthouse` runs the locked
      # @lhci/cli with .lighthouserc.cjs, exactly as it runs locally.
      - name: Lighthouse CI (every page, mobile)
        run: make lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

      - name: Verify SSG Manifest Conformance
        run: |
          if [ -f config/ssg.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('config/ssg.json', 'utf8')); console.log('config/ssg.json is valid JSON');"
          fi

      - name: Run Deterministic Branch Hygiene Check
        run: |
          if [ -f scripts/prune-branches.sh ]; then
            chmod +x scripts/prune-branches.sh
            DRY_RUN=true bash scripts/prune-branches.sh origin
          fi
