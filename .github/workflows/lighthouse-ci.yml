name: Lighthouse CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        form_factor:
          - mobile
          - desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify docs output exists
        run: |
          test -f docs/index.html
          test -f docs/contact/index.html

      - name: Fix PWA Manifest And Icons
        run: node tools/fix-pwa-assets.mjs

      - name: Run Lighthouse CI (mobile)
        if: matrix.form_factor == 'mobile'
        run: npx @lhci/cli@0.13.x autorun --config=.lighthouserc.json

      - name: Run Lighthouse CI (desktop)
        if: matrix.form_factor == 'desktop'
        run: npx @lhci/cli@0.13.x autorun --config=.lighthouserc.json --collect.settings.preset=desktop

      - name: Upload Lighthouse Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.form_factor }}
          path: .lighthouseci
          if-no-files-found: ignore
