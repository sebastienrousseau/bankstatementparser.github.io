repos:
  - repo: local
    hooks:
      - id: repository-version
        name: repository version consistency
        entry: scripts/verify_release_version.sh
        language: script
        pass_filenames: false
      - id: validate-readme
        name: validate readme conformance
        entry: python3 scripts/validate_readme.py
        language: system
        pass_filenames: false
