name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push to main supersedes a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # html-validate, markdownlint-cli2 and @lhci/cli come from
      # package-lock.json; none of them has an install script.
      - name: Install locked Node tooling
        run: npm ci --ignore-scripts

      - name: npm advisory audit (fails on any advisory)
        run: npm audit

      - name: HTML validation (recommended + WCAG rules)
        run: make html

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install locked Python tooling
        run: python -m pip install --quiet --require-hashes -r requirements/test.txt

      # ruff.toml holds the settings; `make style` runs the same two checks.
      - name: Lint (ruff check)
        run: python -m ruff check scripts tests audit fuzz

      - name: Format (ruff format --check)
        run: python -m ruff format --check scripts tests audit fuzz

      - name: README, version, release notes and SPDX lint
        run: make lint

      - name: pip-audit (locked requirements, fails on any advisory)
        run: |
          python -m pip install --quiet --require-hashes -r requirements/audit.txt
          for lock in requirements/test.txt requirements/audit.txt requirements/fuzz.txt; do
            python -m pip_audit --require-hashes --disable-pip -r "$lock"
          done

      - name: Complexity baseline
        run: python3 scripts/check_complexity.py

      - name: WCAG AAA contrast audit
        run: python3 audit/contrast.py

      - name: Structure & no-third-party guardrails
        run: |
          fail=0
          for f in $(find docs -name '*.html'); do
            n=$(grep -o '<h1' "$f" | wc -l)
            [ "$n" -eq 1 ] || { echo "::error file=$f::expected exactly one <h1>, found $n"; fail=1; }
            grep -q 'rel="canonical"' "$f" || { echo "::error file=$f::missing canonical"; fail=1; }
            grep -q 'Content-Security-Policy' "$f" || { echo "::error file=$f::missing CSP"; fail=1; }
            grep -q 'class="skip-link"' "$f" || { echo "::error file=$f::missing skip link"; fail=1; }
            if grep -qoE 'style="[^"]' "$f"; then echo "::error file=$f::inline style attribute (CSP forbids)"; fail=1; fi
            ext=$(grep -oE '(src|href)="https?://[^"]+\.(css|js|woff2?|png|jpg|jpeg|webp|gif)"' "$f" | grep -v 'cloudcdn\.pro' || true)
            if [ -n "$ext" ]; then
              echo "::error file=$f::external asset reference (site must be self-hosted): $ext"; fail=1
            fi
          done
          if [ "$fail" -eq 0 ]; then echo "All structure & self-hosting guardrails passed."; fi
          exit $fail

      - name: Tests with coverage floor (pytest, Hypothesis)
        run: make coverage

  fuzz:
    # Coverage-guided fuzzing of the front-matter validator with Atheris
    # (libFuzzer), as bankstatementparser-mcp fuzzes its tools. The
    # target fails when check() raises or disagrees with the keys it
    # parsed, so a crash here is a real defect.
    name: Fuzz (Atheris)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install locked fuzzing dependencies
        run: python -m pip install --quiet --require-hashes -r requirements/fuzz.txt

      - name: Fuzz the front-matter validator
        run: |
          mkdir -p "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/crashes"
          python fuzz/fuzz_frontmatter.py "$RUNNER_TEMP/corpus" \
            -max_total_time=120 -timeout=25 \
            -artifact_prefix="$RUNNER_TEMP/crashes/"

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: ${{ runner.temp }}/crashes/

  # Publishes the committed, validated docs/ tree to GitHub Pages. The
  # repository's Pages source is "GitHub Actions", so without this job no
  # merge to main reaches the live site.
  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage the site without generator caches
        # docs/ also holds ssg's incremental-build state and host-specific
        # header files; none of it is part of the website.
        run: |
          rsync -a --delete \
            --exclude '.meta/' --exclude '.ssg/' --exclude '.ssg-cache/' \
            --exclude '.ssg-plugin-cache.json' --exclude '_headers' \
            docs/ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test "$(cat _site/CNAME)" = "bankstatementparser.com"
          grep -q '^Contact:' _site/.well-known/security.txt

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          # Keeps .well-known/ (security.txt, ai-plugin.json, mcp.json); the
          # staging step above has already removed the generator caches.
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
