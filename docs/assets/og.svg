<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Bank Statement Parser — every statement format into one model">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#173f86"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(96 132)">
    <rect width="96" height="96" rx="22" fill="#173f86" stroke="#82b4ff" stroke-width="3"/>
    <rect x="27" y="18" width="42" height="60" rx="6" fill="#ffffff"/>
